spring.application.name=EduConflux

# ===============================
# Active Profile & Local Config Import
# ===============================
spring.profiles.active=local
spring.config.import=optional:classpath:application-local.properties

# ===============================
# Database - Neon PostgreSQL
# ===============================

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# ===============================
# JPA / Hibernate
# ===============================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===============================
# EMAIL
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

educonflux.frontend.url=http://localhost:3000

# ===============================
# File Upload Limits
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# Supabase Storage (S3 & REST)
# ===============================
supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.s3.endpointUrl=${SUPABASE_S3_ENDPOINT}
supabase.s3.accessKey=${SUPABASE_S3_ACCESS_KEY:}
supabase.s3.secretKey=${SUPABASE_S3_SECRET_KEY:}
supabase.s3.region=${SUPABASE_S3_REGION:ap-south-1}
supabase.s3.bucketName=${SUPABASE_S3_BUCKET_NAME:educonflux-bucket}
# ========================================================
# EduConflux Master Application Configuration
# ========================================================
spring.application.name=EduConflux
server.port=${PORT:8080}

# ===============================
# Profile Selection
# ===============================
# Defaults to 'local' for local developer machines;
# Docker / Render sets SPRING_PROFILES_ACTIVE=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.config.import=optional:classpath:application-local.properties

# ===============================
# Database Configuration
# (Overridden by active profile: application-local or application-prod)
# ===============================
spring.datasource.url=${DATABASE_URL:}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}

# ===============================
# JPA / Hibernate Defaults
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# JWT Security Defaults
# ===============================
jwt.secret=${JWT_SECRET:alskdjfhgalskdjfhg10293847561029384756}
jwt.expiration=86400000

# ===============================
# Email Notification Defaults
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# Frontend Client URL
# (Local defaults to localhost:5173; Prod defaults to Vercel)
# ===============================
educonflux.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ===============================
# File Upload Limits
# ===============================
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ===============================
# Supabase Storage Defaults
# ===============================
supabase.url=${SUPABASE_URL:}
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.s3.endpointUrl=${SUPABASE_S3_ENDPOINT:}
supabase.s3.accessKey=${SUPABASE_S3_ACCESS_KEY:}
supabase.s3.secretKey=${SUPABASE_S3_SECRET_KEY:}
supabase.s3.region=${SUPABASE_S3_REGION:ap-south-1}
supabase.s3.bucketName=${SUPABASE_S3_BUCKET_NAME:educonflux-bucket}

# ===============================
# Jackson Configuration
# ===============================
spring.jackson.deserialization.fail-on-null-for-primitives=false

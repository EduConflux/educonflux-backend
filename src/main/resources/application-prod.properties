# ========================================================
# EduConflux Production Configuration (Render / Cloud)
# Active when SPRING_PROFILES_ACTIVE=prod
# ========================================================

# Database - Neon PostgreSQL (Injected via Render Environment Variables)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Security & JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# Email Notifications (Injected via Render Environment Variables)
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Brevo HTTP Email API Configuration (Render)
brevo.api.key=${BREVO_API_KEY:}
brevo.sender.email=${BREVO_SENDER_EMAIL:${MAIL_USERNAME:saiamirtheshxoxo@gmail.com}}
brevo.sender.name=${BREVO_SENDER_NAME:EduConflux}


# Frontend CORS Origin (Vercel Production Domain)
educonflux.frontend.url=${FRONTEND_URL:https://edu-conflux.vercel.app}

# Supabase Storage (Injected via Render Environment Variables)
supabase.url=${SUPABASE_URL}
supabase.anon-key=${SUPABASE_ANON_KEY}
supabase.s3.endpointUrl=${SUPABASE_S3_ENDPOINT}
supabase.s3.accessKey=${SUPABASE_S3_ACCESS_KEY:}
supabase.s3.secretKey=${SUPABASE_S3_SECRET_KEY:}
supabase.s3.region=${SUPABASE_S3_REGION:ap-south-1}
supabase.s3.bucketName=${SUPABASE_S3_BUCKET_NAME:educonflux-bucket}

